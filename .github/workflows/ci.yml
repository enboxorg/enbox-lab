name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out Enbox Lab
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck source and tests
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Smoke-test the built agent child
        shell: bash
        run: |
          child_directory="${{ runner.temp }}/agent-child-smoke"
          protocol_output="${{ runner.temp }}/agent-child-smoke.ndjson"
          error_output="${{ runner.temp }}/agent-child-smoke.stderr"
          mkdir -p "$child_directory"
          jq -nc \
            --arg storageDirectory "$child_directory" \
            '{actorGatewayUri:"http://127.0.0.1:9/",remoteDwnOrigin:"http://127.0.0.1:10",$storageDirectory,type:"start"}' \
            | bun packages/lab/dist/esm/runtime/agent-process/agent-process-child.js \
              > "$protocol_output" 2> "$error_output"
          test ! -s "$error_output"
          jq -s -e \
            'length == 2 and .[0].type == "awaiting-secret" and .[0].locked == true and .[0].firstLaunch == true and .[0].packageName == "@enbox/agent" and .[0].packageVersion == "0.8.48" and .[1] == {locked:true,type:"stopped"}' \
            "$protocol_output"

      - name: Smoke-test the built CLI
        shell: bash
        run: |
          bun packages/lab/dist/esm/cli.js --help
          set +e
          bun packages/lab/dist/esm/cli.js did-server --invalid > "${{ runner.temp }}/did-server-invalid.txt" 2>&1
          status=$?
          set -e
          test "$status" -eq 2
          grep -q 'did-server' "${{ runner.temp }}/did-server-invalid.txt"

      - name: Run unit tests with coverage
        run: bun run test:coverage

      - name: Upload unit coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          if-no-files-found: ignore
          name: unit-coverage-${{ github.run_attempt }}
          path: packages/lab/coverage/lcov.info
          retention-days: 14

  linux-proofs:
    name: Linux proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out Enbox Lab
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Initialize evidence record
        run: |
          mkdir -p "${{ runner.temp }}/enbox-lab-evidence"
          echo '{"status":"not-started"}' > "${{ runner.temp }}/enbox-lab-evidence/verification.json"

      - name: Check out Enbox source history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          path: .ci/enbox
          persist-credentials: false
          repository: enboxorg/enbox

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build proof harness
        run: bun run build

      - name: Install managed Chromium and system dependencies
        run: bun run setup:browser:ci

      - name: Run and verify Linux boundary proofs
        run: >-
          bun packages/lab/dist/esm/ci/verify-linux-proofs.js
          --repository "${{ github.workspace }}/.ci/enbox"
          --evidence "${{ runner.temp }}/enbox-lab-evidence"

      - name: Verify built connect JSON CLI
        shell: bash
        run: |
          set +e
          bun packages/lab/dist/esm/cli.js connect-browser --json > "${{ runner.temp }}/enbox-lab-evidence/connect-browser-cli.json"
          status=$?
          set -e
          test "$status" -eq 2
          jq -s -e 'length == 1 and .[0].proof == "p0-browser-connect-denial-boundary" and .[0].status == "unsupported"' \
            "${{ runner.temp }}/enbox-lab-evidence/connect-browser-cli.json"

      - name: Upload proof evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          if-no-files-found: error
          name: linux-proof-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/enbox-lab-evidence
          retention-days: 14
