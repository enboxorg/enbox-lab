name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out Enbox Lab
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck source and tests
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Smoke-test the built CLI
        run: bun packages/lab/dist/esm/cli.js --help

      - name: Run unit tests with coverage
        run: bun run test:coverage

      - name: Upload unit coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          if-no-files-found: ignore
          name: unit-coverage-${{ github.run_attempt }}
          path: packages/lab/coverage/lcov.info
          retention-days: 14

  linux-proofs:
    name: Linux proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out Enbox Lab
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Initialize evidence record
        run: |
          mkdir -p "${{ runner.temp }}/enbox-lab-evidence"
          echo '{"status":"not-started"}' > "${{ runner.temp }}/enbox-lab-evidence/verification.json"

      - name: Check out Enbox source history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          path: .ci/enbox
          persist-credentials: false
          repository: enboxorg/enbox

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install managed Chromium and system dependencies
        run: bunx playwright install --with-deps chromium

      - name: Run and verify Linux boundary proofs
        run: >-
          bun packages/lab/src/ci/verify-linux-proofs.ts
          --repository "${{ github.workspace }}/.ci/enbox"
          --evidence "${{ runner.temp }}/enbox-lab-evidence"

      - name: Upload proof evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          if-no-files-found: error
          name: linux-proof-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/enbox-lab-evidence
          retention-days: 14
